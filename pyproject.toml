[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataorchestra-pilot"
version = "2.0.0"
description = "Controlled pilot tooling for DataOrchestra AI"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
dataorchestra = "dataorchestra.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
panel = [
  "streamlit>=1.33",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
