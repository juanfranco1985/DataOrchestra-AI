name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .[dev]

      - name: Compile
        run: python -m compileall src tests

      - name: Test
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dataorchestra-web/package-lock.json

      - name: Install web dependencies
        working-directory: dataorchestra-web
        run: npm ci

      - name: Build web
        working-directory: dataorchestra-web
        run: npm run build
